name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for the CI database container only.
  SITE_URL: http://localhost:3100
  APP_SECRET: ci-only-secret-ci-only-secret-0123456789
  DATABASE_URL: postgres://site_app:site_app_dev@localhost:5432/personal_site
  MIGRATION_DATABASE_URL: postgres://site_owner:site_owner_dev@localhost:5432/personal_site
  TEST_DATABASE_URL: postgres://site_app:site_app_dev@localhost:5432/personal_site_test
  TEST_MIGRATION_DATABASE_URL: postgres://site_owner:site_owner_dev@localhost:5432/personal_site_test
  E2E_DATABASE_URL: postgres://site_app:site_app_dev@localhost:5432/personal_site_e2e
  E2E_MIGRATION_DATABASE_URL: postgres://site_owner:site_owner_dev@localhost:5432/personal_site_e2e
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/server/db/schema changed without a migration. Run npm run db:generate."
            git status --porcelain drizzle
            exit 1
          fi

  database:
    name: Integration tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Create roles and databases
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres_ci_only
      - run: npm run db:migrate
      - name: Seed runs and is repeatable
        run: npm run db:seed && npm run db:seed
      - name: Owner account script (non-interactive)
        run: npm run admin:create
        env:
          ADMIN_EMAIL: ci-owner@example.test
          ADMIN_PASSWORD: a long ci only passphrase 2026
      - name: Start an S3-compatible server for the object-storage tests
        run: |
          # SeaweedFS with one identity, so request signatures are really checked.
          echo '{"identities":[{"name":"test","credentials":[{"accessKey":"test","secretKey":"test-secret-key"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3.json:/etc/s3.json:ro chrislusf/seaweedfs:4.48 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do
            # Any HTTP answer (anonymous requests get 403) means the S3 gateway is up.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || true)
            if [ "$code" != "000" ]; then echo "S3 gateway up (HTTP $code)"; exit 0; fi
            sleep 2
          done
          docker logs s3 | tail -40
          exit 1
      - run: npm run test:integration
        env:
          S3_TEST_ENDPOINT: http://localhost:8333
      - name: Data retention job runs
        run: npm run maintenance

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Create roles and databases
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres_ci_only
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Production stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Write a throwaway production environment
        run: |
          cat > .env.production <<EOF
          DOMAIN=localhost
          POSTGRES_SUPERUSER_PASSWORD=$(openssl rand -hex 16)
          DB_OWNER_PASSWORD=$(openssl rand -hex 16)
          DB_APP_PASSWORD=$(openssl rand -hex 16)
          APP_SECRET=$(openssl rand -hex 32)
          EOF
      - name: Run the production smoke test
        run: infra/smoke/prod-smoke.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.production ps -a
          docker compose -f docker-compose.prod.yml --env-file .env.production logs
          # Also publish the tail of each service log as annotations (readable without sign-in).
          for svc in db migrate app caddy; do
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --no-color --tail 25 "$svc" > "/tmp/$svc.log" 2>&1 || true
            echo "::error title=$svc logs::$(sed 's/%/%25/g' "/tmp/$svc.log" | awk 'BEGIN{ORS="%0A"} {print}')"
          done
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Blocking: anything shipped to production must be clean.
      - run: npm audit --omit=dev --audit-level=low
      # Informational: dev-tool findings are reviewed in docs/AUTH_AND_SECURITY.md §14.
      - run: npm audit --audit-level=critical
