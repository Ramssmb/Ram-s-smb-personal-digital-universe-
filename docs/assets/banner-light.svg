<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Ram's Smb — Personal Digital Universe</title>
  <desc id="d">A self-hosted personal website and private CMS: Caddy, Next.js and PostgreSQL in Docker.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ecebe7" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2f5bea" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f5bea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#2449c9"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace}
      .sans{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
      .flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.cursor{animation:none}}
    </style>
  </defs>

  <rect width="1280" height="420" rx="20" fill="#fafaf9"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="419" rx="19.5" fill="none" stroke="#e6e5e1"/>

  <!-- left: identity -->
  <g class="mono" font-size="14" fill="#5b5b63" letter-spacing="2">
    <text x="64" y="92">RAM'S SMB · v0.4.0</text>
  </g>
  <g class="sans" font-weight="700" fill="url(#title)">
    <text x="62" y="156" font-size="56">Personal Digital</text>
    <text x="62" y="222" font-size="56">Universe</text>
  </g>
  <text class="sans" x="64" y="266" font-size="19" fill="#5b5b63">A self-hosted personal website with a private CMS,</text>
  <text class="sans" x="64" y="292" font-size="19" fill="#5b5b63">built to publish only what is true.</text>

  <!-- terminal line -->
  <g transform="translate(64 326)">
    <rect width="520" height="46" rx="10" fill="#ffffff" stroke="#e6e5e1"/>
    <text class="mono" x="18" y="29" font-size="15"><tspan fill="#2f5bea">$</tspan><tspan fill="#18181b"> docker compose up -d</tspan><tspan fill="#8a8a92">  # caddy · app · db</tspan></text>
    <rect class="cursor" x="386" y="15" width="9" height="17" fill="#2f5bea"/>
  </g>

  <!-- right: request path -->
  <g class="mono" font-size="13" fill="none">
    <g stroke="#2f5bea" stroke-opacity=".75" stroke-width="2">
      <path class="flow" d="M760 120 H800"/>
      <path class="flow" d="M900 120 H940"/>
      <path class="flow" d="M1040 148 C1040 190 1040 240 1060 240"/>
      <path class="flow" d="M1030 148 C1030 260 1040 320 1060 320"/>
      <path class="flow" d="M990 148 C990 200 980 236 960 236"/>
    </g>
  </g>
  <g class="mono" font-size="13" text-anchor="middle">
    <g transform="translate(680 96)">
      <rect width="80" height="48" rx="10" fill="#ffffff" stroke="#d4d3ce"/>
      <text x="40" y="22" fill="#18181b">HTTPS</text>
      <text x="40" y="38" fill="#8a8a92" font-size="11">:443</text>
    </g>
    <g transform="translate(800 92)">
      <rect width="100" height="56" rx="12" fill="#eef2fe" stroke="#2f5bea" stroke-opacity=".6"/>
      <text x="50" y="25" fill="#18181b">Caddy</text>
      <text x="50" y="42" fill="#2449c9" font-size="11">TLS · HTTP/3</text>
    </g>
    <g transform="translate(940 92)">
      <rect width="160" height="56" rx="12" fill="#ffffff" stroke="#d4d3ce"/>
      <text x="80" y="25" fill="#18181b">Next.js 16</text>
      <text x="80" y="42" fill="#5b5b63" font-size="11">CSP nonce · RSC</text>
    </g>
    <g transform="translate(820 212)">
      <rect width="140" height="48" rx="10" fill="#ffffff" stroke="#d4d3ce" stroke-dasharray="4 4"/>
      <text x="70" y="22" fill="#18181b">/admin</text>
      <text x="70" y="38" fill="#8a8a92" font-size="11">Argon2id · TOTP</text>
    </g>
    <g transform="translate(1060 212)">
      <rect width="160" height="56" rx="12" fill="#ffffff" stroke="#d4d3ce"/>
      <text x="80" y="25" fill="#18181b">PostgreSQL 17</text>
      <text x="80" y="42" fill="#5b5b63" font-size="11">least-privilege role</text>
    </g>
    <g transform="translate(1060 292)">
      <rect width="160" height="56" rx="12" fill="#ffffff" stroke="#d4d3ce"/>
      <text x="80" y="25" fill="#18181b">Media</text>
      <text x="80" y="42" fill="#5b5b63" font-size="11">disk volume or S3</text>
    </g>
  </g>
  <circle class="pulse" cx="1208" cy="226" r="4" fill="#16a34a"/>
  <circle class="pulse" cx="1208" cy="306" r="4" fill="#16a34a" style="animation-delay:.8s"/>
  <text class="mono" x="680" y="384" font-size="12" fill="#8a8a92">180 HTTP/DB checks · 90 browser tests · restore verified in CI</text>
</svg>
